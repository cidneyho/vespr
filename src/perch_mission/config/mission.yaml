# Mission and planner settings. Every number is a placeholder to tune by experiment.
# Use your own copy: ros2 launch perch_mission mission.launch.py params_file:=/path/to/mine.yaml
# Write every number with a decimal point (0.0, not 0): ROS 2 types 0 as an integer.
mission:
  ros__parameters:
    # Which implementation each phase uses (docs/design/planning.md)
    fly_to_planner: straight
    search_planner: turn
    approach_planner: standoff

    takeoff_timeout: 30.0     # s to reach the altitude after taking off
    land_settle: 2.0          # s in land mode before disarming on the branch
    motors_off_timeout: 5.0   # s for PX4 to disarm on the branch
    land_timeout: 60.0        # s to land and disarm
    back_out: 0.6             # m to back straight out when no final move was made
    back_out_speed: 0.1       # m/s
    pre_launch_lift: 0.03     # m above where it hangs to aim for on re-arming (starts PX4's takeoff)
    pre_launch_time: 5.0      # s for the thrust to build, still latched, before releasing
    climb_out_lift: 0.15      # m to rise while backing out, to clear the hook's overhang
    fall_height: 0.5          # m: on the branch, a rangefinder reading below this means it fell

    # Settings for each phase's planner. The target and heading come from the /vespr/perch goal
    fly_to:
      cruise_speed: 0.5       # m/s
      settle_time: 0.5        # s after each move before trusting a sighting
    search:
      search_step: 30.0       # deg per turn
      search_dwell: 1.0       # s to look after each turn
      seen_frames: 5          # sightings in a row that count as found
      settle_time: 0.5
    approach:
      capture_x: 0.0          # where the branch should end up in base_link, m: the hook hole
      capture_y: 0.0
      capture_z: 0.30
      standoff_back: 1.0      # standoff point from the capture point, m. The camera sits 0.30 m
                              # below the capture point and sees 21 deg up: at 1.0 m the branch
                              # is 18.7 deg up, still in view
      standoff_down: 0.0
      approach_speed: 0.2     # m/s
      final_speed: 0.1        # m/s
      step_length: 0.3        # longest approach step, m
      yaw_tolerance: 5.0      # deg
      standoff_tolerance: 0.05  # m
      keep_in_view: 25.0      # most a turn may leave the branch off the nose, deg
      lost_timeout: 2.0       # s without a sighting before giving up
      max_range: 3.0          # m
      settle_time: 0.5
